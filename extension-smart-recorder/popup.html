<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Tahoma, sans-serif; width: 260px; padding: 12px; margin: 0; }
      .muted { color: #666; font-size: 12px; line-height: 1.5; }
      h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
      button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; }
      #stop { background: #0d9488; color: #fff; }
      #refresh { background: #f1f0ff; color: #4b465c; }
    </style>
  </head>
  <body>
    <h4>
      <img src="icons/mark.svg" width="22" height="22" alt="" style="border-radius:5px" />
      <span data-i18n="app.title">Smart Recorder</span>
    </h4>
    <div id="status" class="muted">...</div>
    <button id="refresh" data-i18n="popup.refresh">Refresh</button>
    <button id="stop" data-i18n="popup.stop" hidden>Stop thinking</button>
    <p class="muted" data-i18n="popup.hint">Start from the process list. Logo on the page stops thinking. No logs.</p>
    <script src="lib/rec-i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
