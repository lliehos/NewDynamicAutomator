<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Tahoma, sans-serif; width: 360px; padding: 12px; margin: 0; }
      h4 { margin: 0 0 8px; }
      .muted { color: #666; font-size: 12px; line-height: 1.55; margin: 0 0 8px; }
      ul.muted { padding-right: 18px; margin: 0 0 10px; }
      code { display: block; background: #f5f5f9; padding: 8px; border-radius: 8px; font-size: 11px; word-break: break-all; max-height: 120px; overflow: auto; }
      button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 6px; cursor: pointer; background: #f1f0ff; }
      #clear { background: #6e6b7b; color: #fff; }
    </style>
  </head>
  <body>
    <h4 style="display:flex;align-items:center;gap:8px">
      <img src="icons/icon32.png" width="22" height="22" alt="" style="border-radius:5px" />
      سلکتور — مروبات
    </h4>
    <p class="muted">راست‌کلیک → مروبات — سلکتور:</p>
    <ul class="muted">
      <li><b>یونیک:</b> المنت / فریم / آبجکت — فقط یک match</li>
      <li><b>نسبی:</b> المنت / فریم / آبجکت — کوتاه، ممکن چند match</li>
    </ul>
    <p class="muted">در DevTools → Elements → سایدبار «مروبات سلکتور» (کنار Styles) همان ۶ دکمه برای $0.</p>
    <div class="muted" id="status">...</div>
    <code id="preview">—</code>
    <button type="button" id="refresh">تازه‌سازی</button>
    <button type="button" id="clear">پاک کردن حافظه آبجکت</button>
    <script src="popup.js"></script>
  </body>
</html>
