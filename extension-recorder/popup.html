<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Tahoma, sans-serif; width: 300px; padding: 12px; margin: 0; }
      button, select, input { width: 100%; margin-top: 8px; padding: 8px; box-sizing: border-box; }
      .muted { color: #666; font-size: 12px; }
      h4 { margin: 0 0 8px; }
      #record, #finish { background: #ea5455; color: #fff; border: 0; border-radius: 6px; }
      #upload { background: #28c76f; color: #fff; border: 0; border-radius: 6px; }
      label { display: block; font-size: 12px; color: #666; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h4 style="display:flex;align-items:center;gap:8px">
      <img src="icons/icon32.png" width="22" height="22" alt="" style="border-radius:5px" />
      ضبط — مروبات
    </h4>
    <div id="status" class="muted">در حال بررسی...</div>
    <button id="refresh">تازه‌سازی</button>
    <div id="idle-box">
      <label for="record-tab">محل ضبط</label>
      <select id="record-tab"><option value="">تب جدید (خالی)</option></select>
      <button id="record">شروع ضبط</button>
    </div>
    <div id="rec-box" hidden>
      <p class="muted">روی تب انتخاب‌شده کار کنید؛ تغییر آدرس به‌عنوان GoToUrl ثبت می‌شود.</p>
      <button id="finish">اتمام ضبط</button>
    </div>
    <div id="review-box" hidden>
      <input id="title" type="text" value="فرآیند ضبط‌شده" placeholder="عنوان فرآیند" />
      <button id="upload">ذخیره محلی</button>
      <button id="rerecord">ضبط مجدد</button>
      <button id="discard">انصراف</button>
    </div>
    <p class="muted">برای اجرا، افزونهٔ Player را جداگانه نصب کنید.</p>
    <script src="popup.js"></script>
  </body>
</html>
