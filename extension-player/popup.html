<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Tahoma, sans-serif; width: 280px; padding: 12px; margin: 0; }
      button { width: 100%; margin-top: 8px; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 0; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      .muted { color: #666; font-size: 12px; line-height: 1.5; }
      h4 { margin: 0 0 8px; }
      #playpause.mode-play { background: #28c76f; color: #fff; }
      #playpause.mode-pause { background: #ff9f43; color: #fff; }
      #stop { background: #ea5455; color: #fff; }
      #clear { background: #6e6b7b; color: #fff; }
      #refresh { background: #f1f0ff; color: #4b465c; }
    </style>
  </head>
  <body>
    <h4>اجرا — اتوماتور پویا</h4>
    <div id="status" class="muted">در حال بررسی...</div>
    <button id="refresh">تازه‌سازی</button>
    <button id="playpause" class="mode-play">اجرا</button>
    <button id="stop" hidden>توقف (از اول)</button>
    <button id="clear">پاکسازی لاگ‌ها</button>
    <p class="muted">اجرا بعد از پاز = ادامه · توقف سپس اجرا = از اول. اولین اجرا را از پورتال بزنید.</p>
    <script src="popup.js"></script>
  </body>
</html>
